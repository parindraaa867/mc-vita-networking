# dnsmasq config for redirecting the Vita's PSN lookups to this PC.
#
# Purpose: the Vita will be told (via its manual network settings) to use this
# PC as its DNS server. dnsmasq answers PSN/Minecraft domains with THIS PC's IP
# so their HTTPS traffic lands in mitmproxy; everything else resolves normally
# upstream so the Vita still has working internet.
#
# Usage (in WSL):
#   sudo dnsmasq --no-daemon --conf-file=scripts/dnsmasq.conf
#
# >>> EDIT THIS: set to the PC's LAN IP that the Vita can reach <<<
#     Find it with `ip addr` (WSL2: you likely need the Windows host LAN IP,
#     and a Windows-side `netsh interface portproxy` / firewall rule — see
#     docs/SETUP.md, the WSL2 networking note).
#
# address=/DOMAIN/<PC_IP>

# --- PSN / NP infrastructure (from the Vita packet-capture archive) ---
address=/np.community.playstation.net/192.168.1.50
address=/np.dl.playstation.net/192.168.1.50
address=/dl.playstation.net/192.168.1.50
address=/account.sonyentertainmentnetwork.com/192.168.1.50
address=/auth.api.sonyentertainmentnetwork.com/192.168.1.50

# --- Minecraft / 4J / Mojang backends (add more as captures reveal them) ---
address=/minecraft.net/192.168.1.50
address=/mojang.com/192.168.1.50

# Resolve everything else normally so the Vita keeps working.
server=1.1.1.1
server=8.8.8.8

# Listen on all interfaces (lock down with firewall to the Vita's IP if needed).
listen-address=0.0.0.0
bind-interfaces
no-resolv
log-queries
log-facility=./captures/dnsmasq.log
